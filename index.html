<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>تسجيل الدخول - HAMA HOST PANEL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
    
    :root {
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --primary-light: #00ffff;
      --accent-glow: #00ffff;
      --gradient: linear-gradient(90deg, #00d4ff, #0066ff, #00d4ff);
      --admin-gold: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      --bg-dark: #05060a;
      --bg-card: rgba(5, 10, 20, 0.95);
      --text: #ffffff;
      --text-muted: #a0aec0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    /* خلفية متحركة */
    .background-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    
    .fast-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      height: 2px;
      filter: blur(0.5px);
      opacity: 0.6;
      animation: fastLineMove 8s linear infinite;
      box-shadow: 0 0 20px var(--primary);
    }
    
    @keyframes fastLineMove {
      0% { transform: translateX(-100vw) rotate(0deg); }
      100% { transform: translateX(100vw) rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      animation: slideIn 0.8s ease-out;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .logo {
      font-size: 3.5rem;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
      animation: pulse 3s infinite;
      text-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    
    .tagline {
      color: var(--text-muted);
      font-size: 1.2rem;
      margin-top: 10px;
      font-weight: 300;
      letter-spacing: 1px;
    }
    
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      border: 2px solid rgba(0, 212, 255, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient);
    }
    
    .form-title {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: var(--text);
      font-weight: 700;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .form-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: var(--gradient);
      border-radius: 2px;
      box-shadow: 0 0 20px var(--primary);
    }
    
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 10px;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
    }
    
    .form-group input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(0, 212, 255, 0.3);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.1rem;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 212, 255, 0.1);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
    }
    
    .btn-login {
      width: 100%;
      padding: 18px;
      background: var(--gradient);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      font-family: 'Tajawal', sans-serif;
      position: relative;
      overflow: hidden;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0, 136, 255, 0.6);
    }
    
    .message {
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 1rem;
      animation: slideIn 0.5s;
      display: none;
      font-weight: 600;
    }
    
    .success {
      background: rgba(76, 175, 80, 0.15);
      border: 2px solid rgba(76, 175, 80, 0.4);
      color: #4CAF50;
    }
    
    .error {
      background: rgba(244, 67, 54, 0.15);
      border: 2px solid rgba(244, 67, 54, 0.4);
      color: #f44336;
    }
    
    .loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      border: 4px solid rgba(0, 212, 255, 0.3);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px var(--primary);
    }
    
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="background-animation" id="backgroundAnimation"></div>
  
  <div class="login-container">
    <div class="card">
      <div class="logo-section">
        <div class="logo">HAMA HOST</div>
        <div class="tagline">لوحة تحكم احترافية للاستضافة</div>
      </div>
      
      <h2 class="form-title">تسجيل الدخول</h2>
      
      <div class="form-group">
        <label for="username">👤 اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم">
      </div>
      
      <div class="form-group">
        <label for="password">🔒 كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور">
      </div>
      
      <button class="btn-login" onclick="login()" id="loginBtn">
        <span id="loginText">🚀 دخول إلى النظام</span>
        <div class="loading" id="loginLoading"></div>
      </button>
      
      <div id="message" class="message"></div>
    </div>
  </div>

  <script>
    // إنشاء الخلفية المتحركة
    function createAnimatedBackground() {
      const container = document.getElementById('backgroundAnimation');
      for (let i = 0; i < 10; i++) {
        const line = document.createElement('div');
        line.className = 'fast-line';
        line.style.top = `${Math.random() * 100}%`;
        line.style.width = `${300 + Math.random() * 400}px`;
        line.style.animationDelay = `${Math.random() * 2}s`;
        container.appendChild(line);
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 4000);
    }

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (!username || !password) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }

      const btn = document.getElementById('loginBtn');
      const text = document.getElementById('loginText');
      const loading = document.getElementById('loginLoading');
      
      text.style.display = 'none';
      loading.style.display = 'block';
      btn.disabled = true;

      // الحسابات المسموحة
      const validAccounts = {
        "ayyy1234": ["12345", "123456", "1234567"]
      };

      setTimeout(() => {  // محاكاة تأخير
        if (validAccounts[username] && validAccounts[username].includes(password)) {
          showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');
          setTimeout(() => {
            window.location.href = "admin_panel.html";  // الصفحة التالية
          }, 1000);
        } else {
          showMessage('❌ اسم المستخدم أو كلمة المرور خاطئة', 'error');
          text.style.display = 'inline';
          loading.style.display = 'none';
          btn.disabled = false;
        }
      }, 800);
    }

    // دعم زر Enter
    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });

    document.addEventListener('DOMContentLoaded', createAnimatedBackground);
  </script>
</body>
</html>
