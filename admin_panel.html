<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>HAMA HOST PANEL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --bg: #05060a;
      --muted: #99a3ad;
      --accent: #00d4ff;
      --gradient: linear-gradient(135deg, #00d4ff 0%, #0088ff 50%, #0066cc 100%);
      --success: #00ff88;
      --error: #ff5555;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e9f2f7; min-height: 100vh; position: relative; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid rgba(0,212,255,0.1); position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
    
    .panel-logo { font-size: 18px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    
    .logout-btn { background: transparent; border: 1px solid var(--error); color: var(--error); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    
    #cardsContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    
    .card { padding: 40px 20px; background: rgba(12,17,29,0.8); border-radius: 12px; border: 1px solid rgba(0,212,255,0.1); text-align: center; cursor: pointer; }
    
    .srv-icon { width: 32px; height: 22px; background: var(--accent); border-radius: 4px; margin: 0 auto 20px; position: relative; box-shadow: 0 8px 0 0 var(--accent); animation: pulse 2s infinite; }
    
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
    
    .mgr-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; }
    
    .console-box { background: rgba(0,0,0,0.8); padding: 20px; height: 550px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; border-radius: 10px; border: 1px solid rgba(0,212,255,0.1); color: #adbac7; white-space: pre-wrap; }
    
    .console-box::-webkit-scrollbar { width: 8px; }
    .console-box::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    
    .btn-act { width: 100%; padding: 14px; margin-bottom: 10px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; color: white; }
    
    .install-btn { background: var(--success); color: black; font-weight: bold; }
    
    .upload-area { border: 2px dashed var(--accent); border-radius: 10px; padding: 40px; text-align: center; margin: 20px 0; cursor: pointer; background: rgba(0,212,255,0.05); position: relative; }
    
    .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: rgba(0,212,255,0.1); padding: 12px 10px; color: var(--accent); }
    td { padding: 15px 10px; border-bottom: 1px solid rgba(0,212,255,0.1); }
    
    .f-btn { padding: 5px 10px; border-radius: 5px; border: 0; font-size: 11px; cursor: pointer; margin-right: 5px; background: rgba(43,49,58,0.8); color: white; }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button onclick="goHome()" style="background:none;border:0;color:white;font-size:20px;cursor:pointer">🏠</button>
      <div class="panel-logo">HAMA HOST PANEL</div>
    </div>
    <div style="display:flex;align-items:center;gap:15px">
      <span>Welcome, ayyy1234</span>
      <button class="logout-btn" onclick="window.location.href='index.html'">تسجيل الخروج</button>
    </div>
  </header>

  <main class="container" id="homeView">
    <div id="cardsContainer">
      <div class="card" onclick="openServer()">
        <div class="srv-icon"></div>
        <div class="card-title">Main Bot Server</div>
        <div class="card-sub">Python Bot</div>
      </div>
    </div>
  </main>

  <main class="container" id="serverView" style="display:none">
    <div style="margin-bottom:20px">
      <h1 style="color:var(--accent)">Main Bot Server</h1>
    </div>

    <div class="mgr-grid">
      <div class="console-box" id="consoleLog">Console ready...\n</div>
      <div>
        <button class="btn-act install-btn" id="installBtn" onclick="event.stopPropagation(); installLibraries()">📦 Install Libraries</button>
        <button class="btn-act" style="background:var(--gradient)" onclick="event.stopPropagation(); runBot()">▶️ Run bot.py</button>
        <button class="btn-act" style="background:var(--error)" onclick="event.stopPropagation(); stopBot()">⏹️ Stop Bot</button>
      </div>
    </div>

    <div class="upload-area" id="uploadArea">
      <div style="font-size:48px;margin-bottom:15px;color:var(--accent)">🚀</div>
      <div style="color:var(--muted)">ارفع bot.py أو requirements.txt</div>
      <input type="file" id="fileInput" multiple>
    </div>

    <table>
      <thead><tr><th>Name</th><th>Size</th><th>Actions</th></tr></thead>
      <tbody id="fileList"></tbody>
    </table>
  </main>

  <script>
    const userKey = "ayyy1234";
    let files = JSON.parse(localStorage.getItem(`files_${userKey}`) || '[]');
    let botContent = localStorage.getItem(`bot_py_content_${userKey}`) || '';
    let installed = JSON.parse(localStorage.getItem(`installed_${userKey}`) || 'false');
    let runInterval = null;

    const libraries = [
      { name: "pyTelegramBotAPI", version: "4.14.0", size: "223 kB" },
      { name: "requests", version: "2.31.0", size: "97 kB" },
      { name: "httpx", version: "0.27.0", size: "105 kB" },
      { name: "groq", version: "0.4.1", size: "45 kB" }
    ];

    function addConsoleLine(line) {
      const log = document.getElementById('consoleLog');
      log.textContent += line + '\n';
      log.scrollTop = log.scrollHeight;
    }

    function openServer() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('serverView').style.display = 'block';
      loadFiles();
      addConsoleLine("تم الدخول إلى السيرفر");
      
      if (installed) {
        document.getElementById('installBtn').textContent = "المكتبات مثبتة ✅";
        document.getElementById('installBtn').disabled = true;
      }
    }

    function goHome() {
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('serverView').style.display = 'none';
    }

    function loadFiles() {
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      files.forEach(file => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="color:var(--accent)">${file.name}</td>
          <td>${file.size}</td>
          <td>
            <button class="f-btn" onclick="event.stopPropagation(); alert('تحرير ${file.name}')">✏️ Edit</button>
            <button class="f-btn" style="background:var(--error)" onclick="event.stopPropagation(); deleteFile('${file.name}')">🗑️ Delete</button>
          </td>
        `;
        list.appendChild(row);
      });
    }

    function deleteFile(name) {
      files = files.filter(f => f.name !== name);
      if (name === 'bot.py') botContent = '';
      localStorage.setItem(`files_${userKey}`, JSON.stringify(files));
      loadFiles();
    }

    document.getElementById('fileInput').onchange = function(e) {
      const uploaded = e.target.files;
      if (uploaded.length === 0) return;
      
      Array.from(uploaded).forEach(file => {
        const fileData = { name: file.name, size: (file.size / 1024).toFixed(1) + ' KB' };
        if (!files.some(f => f.name === file.name)) {
          files.push(fileData);
          addConsoleLine(`تم رفع: ${file.name}`);
        }
        
        if (file.name === 'bot.py') {
          const reader = new FileReader();
          reader.onload = function(e) {
            botContent = e.target.result;
            localStorage.setItem(`bot_py_content_${userKey}`, botContent);
            addConsoleLine("تم تحميل محتوى bot.py");
          };
          reader.readAsText(file);
        }
      });
      
      localStorage.setItem(`files_${userKey}`, JSON.stringify(files));
      loadFiles();
    };

    function installLibraries() {
      if (installed) {
        addConsoleLine("المكتبات مثبتة بالفعل");
        return;
      }
      
      const btn = document.getElementById('installBtn');
      btn.disabled = true;
      
      let i = 0;
      const installInterval = setInterval(() => {
        if (i < libraries.length) {
          const lib = libraries[i];
          addConsoleLine(`Collecting ${lib.name}`);
          setTimeout(() => {
            addConsoleLine(`  Downloading \( {lib.name}- \){lib.version}-py3-none-any.whl (${lib.size})`);
            setTimeout(() => {
              addConsoleLine(`  Installing collected packages: ${lib.name}`);
              setTimeout(() => {
                addConsoleLine(`  Successfully installed \( {lib.name}- \){lib.version}`);
              }, 800);
            }, 600);
          }, 400);
          i++;
        } else {
          clearInterval(installInterval);
          addConsoleLine("تم تثبيت جميع المكتبات بنجاح!");
          installed = true;
          localStorage.setItem(`installed_${userKey}`, 'true');
          btn.textContent = "تم التثبيت ✅";
          runBot(); // تشغيل تلقائي بعد التثبيت
        }
      }, 2000);
    }

    function runBot() {
      if (!botContent) {
        addConsoleLine("خطأ: bot.py غير موجود");
        return;
      }
      
      addConsoleLine("python bot.py");
      
      const lines = botContent.split('\n');
      let i = 0;
      runInterval = setInterval(() => {
        if (i < lines.length) {
          const line = lines[i].trim();
          if (line.startsWith('print') || line.includes('print(')) {
            const msg = line.replace(/print\(['"]?/, '').replace(/['"]?\)/, '').trim();
            addConsoleLine(msg);
          }
          i++;
        } else {
          clearInterval(runInterval);
          addConsoleLine("البوت يعمل في الخلفية...");
        }
      }, 500);
    }

    function stopBot() {
      clearInterval(runInterval);
      addConsoleLine("تم إيقاف bot.py");
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFiles();
    });
  </script>
</body>
</html>
