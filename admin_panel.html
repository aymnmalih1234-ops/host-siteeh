<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>HAMA HOST PANEL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --bg: #05060a;
      --muted: #99a3ad;
      --accent: #00d4ff;
      --accent-light: #6aefff;
      --accent-dark: #00a8cc;
      --panel-border: rgba(0, 212, 255, 0.1);
      --card: rgba(12, 17, 29, 0.8);
      --gradient: linear-gradient(135deg, #00d4ff 0%, #0088ff 50%, #0066cc 100%);
      --success: #00ff88;
      --error: #ff5555;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: #e9f2f7;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    .animated-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden;
    }
    
    .animated-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: moveLine 20s linear infinite;
      opacity: 0.05;
    }
    
    @keyframes moveLine {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(calc(100vw + 100px)); }
    }
    
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.7; transform:scale(1.05); } }
    
    .topbar {
      display: flex; justify-content: space-between; align-items: center; padding: 14px 20px;
      border-bottom: 1px solid var(--panel-border); position: sticky; top: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px); z-index: 1000; animation: slideIn 0.5s ease-out;
    }
    
    .panel-logo { font-size: 18px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    
    .new-btn {
      background: var(--gradient); color: #00121a; padding: 8px 16px; border-radius: 6px; border: 0;
      font-weight: 800; cursor: pointer; font-size: 12px; transition: all 0.3s; position: relative; overflow: hidden;
    }
    
    .new-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,136,255,0.4); }
    
    .logout-btn {
      background: transparent; border: 1px solid var(--error); color: var(--error); padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.3s;
    }
    
    .logout-btn:hover { background: rgba(255,85,85,0.1); }
    
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; animation: slideIn 0.7s ease-out; }
    
    #cardsContainer {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;
    }
    
    .card {
      padding: 40px 20px; background: var(--card); border-radius: 12px; border: 1px solid var(--panel-border);
      text-align: center; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(5px);
    }
    
    .card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--accent); box-shadow: 0 15px 30px rgba(0,212,255,0.2); }
    
    .srv-icon {
      width: 32px; height: 22px; background: var(--accent); border-radius: 4px; margin: 0 auto 20px;
      position: relative; box-shadow: 0 8px 0 0 var(--accent); animation: pulse 2s infinite;
    }
    
    .srv-icon::after {
      content: ""; position: absolute; top: 4px; left: 22px; width: 4px; height: 4px;
      background: #000; border-radius: 50%; box-shadow: 0 8px 0 0 #000;
    }
    
    .card-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(90deg, #fff, var(--accent-light)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card-sub { color: var(--muted); font-size: 12px; }
    
    .mgr-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; }
    
    .console-box {
      background: rgba(0,0,0,0.8); padding: 20px; height: 550px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: 13px; border-radius: 10px;
      border: 1px solid var(--panel-border); color: #adbac7; white-space: pre-wrap;
    }
    
    .btn-act {
      width: 100%; padding: 14px; margin-bottom: 10px; border: 0; border-radius: 8px;
      font-weight: 700; cursor: pointer; color: white; transition: all 0.3s; position: relative; overflow: hidden;
    }
    
    .btn-act.running { background: white !important; color: black !important; opacity: 0.5; cursor: not-allowed; }
    
    .stat-card {
      background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; margin-bottom: 10px;
      border: 1px solid var(--panel-border); display: flex; align-items: center; gap: 12px;
    }
    
    .status-running { color: var(--success); animation: pulse 2s infinite; }
    .status-offline { color: var(--error); }
    
    .loading-dots { display: inline-flex; gap: 4px; }
    .loading-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1.5s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    
    .upload-area {
      border: 2px dashed var(--accent); border-radius: 10px; padding: 40px; text-align: center;
      margin: 20px 0; cursor: pointer; background: rgba(0,212,255,0.05); transition: all 0.3s;
    }
    
    .upload-area:hover { background: rgba(0,212,255,0.1); border-color: var(--accent-light); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: rgba(0,212,255,0.1); padding: 12px 10px; color: var(--accent); border-bottom: 2px solid var(--accent); }
    td { padding: 15px 10px; border-bottom: 1px solid var(--panel-border); }
    tr:hover td { background: rgba(0,212,255,0.05); }
    
    .f-btn { padding: 5px 10px; border-radius: 5px; border: 0; font-size: 11px; cursor: pointer; margin-right: 5px; background: rgba(43,49,58,0.8); color: white; }
    
    @media (max-width: 768px) {
      .mgr-grid { grid-template-columns: 1fr; }
      #cardsContainer { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="animated-bg" id="animatedBg"></div>
  
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button onclick="goHome()" style="background:none;border:0;color:white;font-size:20px;cursor:pointer;">🏠</button>
      <div class="panel-logo" id="headerTitle">HAMA HOST PANEL</div>
    </div>
    <div style="display:flex;align-items:center;gap:15px">
      <div class="user-info">
        <span>Welcome, <span id="usernameDisplay">ayyy1234</span></span>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
      </div>
      <button id="newBtn" class="new-btn">+ أنشاء سرفر</button>
    </div>
  </header>

  <main class="container" id="homeView">
    <div id="cardsContainer"></div>
  </main>

  <main class="container" id="serverView" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1 id="srvHeader" style="color:var(--accent);font-size:24px;">SERVER</h1>
      <div style="display:flex;gap:10px">
        <button class="new-btn" onclick="switchTab('console')">Console</button>
        <button class="new-btn" style="background:rgba(34,34,34,0.8)" onclick="switchTab('files')">File Manager</button>
      </div>
    </div>

    <div id="viewConsole" class="mgr-grid">
      <div class="console-box" id="logOut">Initializing console...</div>
      <div>
        <button id="btnStart" class="btn-act" style="background:var(--gradient)" onclick="srvAction('start')">START</button>
        <button id="btnRestart" class="btn-act" style="background:rgba(43,49,58,0.8)" onclick="srvAction('restart')">RESTART</button>
        <button class="btn-act" style="background:var(--error)" onclick="srvAction('stop')">STOP</button>
        
        <div class="stat-card"><div style="font-size:20px;">⚡</div><div><small>STATUS</small><br><b id="statusTxt" class="status-offline">Offline</b></div></div>
        <div class="stat-card"><div style="font-size:20px;">🧠</div><div><small>RAM USAGE</small><br><b id="memTxt">0 MB</b></div></div>
        <div class="stat-card"><div style="font-size:20px;">💿</div><div><small>MAIN FILE</small><br><b id="mainFileTxt" style="color:var(--accent)">server.js</b></div></div>
        <div class="stat-card"><div style="font-size:20px;">🌐</div><div><small>IP ADDRESS</small><br><b id="ipTxt">127.0.0.1:3000</b></div></div>
      </div>
    </div>

    <div id="viewFiles" style="display:none">
      <div class="upload-area" id="uploadArea">
        <div style="font-size:48px;margin-bottom:15px;color:var(--accent)">🚀</div>
        <div style="color:var(--muted);margin-bottom:10px;font-size:16px">اسحب الملفات هنا أو اضغط للرفع</div>
        <div style="font-size:12px;color:var(--muted);opacity:0.7">الرفع وهمي (للعرض فقط)</div>
        <input type="file" id="fileInput" multiple style="position:absolute;inset:0;opacity:0;cursor:pointer">
      </div>
      
      <table>
        <thead><tr><th>Name</th><th>Size</th><th>Actions</th></tr></thead>
        <tbody id="serverFileList">
          <tr><td style="color:var(--accent)">server.js</td><td>2.4 KB</td><td><button class="f-btn">✏️ Edit</button><button class="f-btn" style="background:var(--error)">🗑️ Delete</button></td></tr>
          <tr><td style="color:var(--accent)">package.json</td><td>1.1 KB</td><td><button class="f-btn">✏️ Edit</button><button class="f-btn" style="background:var(--error)">🗑️ Delete</button></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // بيانات وهمية
    let servers = [
      { title: "Main Server", subtitle: "Node.js Bot", startup_file: "server.js", folder: "main" },
      { title: "Backup Server", subtitle: "Python Script", startup_file: "bot.py", folder: "backup" }
    ];
    
    let currentSrv = null;
    let isRunning = false;
    let logInterval = null;

    function createAnimatedBackground() {
      const container = document.getElementById('animatedBg');
      for (let i = 0; i < 8; i++) {
        const line = document.createElement('div');
        line.className = 'animated-line';
        line.style.top = `${Math.random() * 100}%`;
        line.style.width = `${200 + Math.random() * 300}px`;
        container.appendChild(line);
      }
    }

    function loadServers() {
      const cont = document.getElementById('cardsContainer');
      cont.innerHTML = '';
      servers.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="srv-icon"></div>
          <div class="card-title">${s.title}</div>
          <div class="card-sub">${s.subtitle}</div>
          <div style="margin-top:10px;font-size:10px;color:var(--accent)">⚡ ${s.startup_file}</div>
        `;
        div.onclick = () => openServer(s);
        cont.appendChild(div);
      });
    }

    function openServer(s) {
      currentSrv = s;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('newBtn').style.display = 'none';
      document.getElementById('serverView').style.display = 'block';
      document.getElementById('srvHeader').textContent = s.title;
      document.getElementById('mainFileTxt').textContent = s.startup_file;
      switchTab('console');
    }

    function goHome() {
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('newBtn').style.display = 'block';
      document.getElementById('serverView').style.display = 'none';
      clearInterval(logInterval);
      loadServers();
    }

    function switchTab(t) {
      document.getElementById('viewConsole').style.display = t === 'console' ? 'grid' : 'none';
      document.getElementById('viewFiles').style.display = t === 'files' ? 'block' : 'none';
      if (t === 'console') startFakeConsole();
    }

    function startFakeConsole() {
      const log = document.getElementById('logOut');
      log.textContent = "[INFO] Server starting...\n";
      let lines = 0;
      logInterval = setInterval(() => {
        if (isRunning && lines < 20) {
          lines++;
          log.textContent += `[${new Date().toLocaleTimeString()}] Server running on port 3000\n`;
          log.scrollTop = log.scrollHeight;
        }
      }, 2000);
    }

    function srvAction(act) {
      const statusTxt = document.getElementById('statusTxt');
      const btnStart = document.getElementById('btnStart');
      
      if (act === 'start') {
        isRunning = true;
        statusTxt.textContent = "Running";
        statusTxt.className = "status-running";
        btnStart.className = "btn-act running";
        btnStart.disabled = true;
      } else if (act === 'stop') {
        isRunning = false;
        statusTxt.textContent = "Offline";
        statusTxt.className = "status-offline";
        btnStart.className = "btn-act";
        btnStart.disabled = false;
        btnStart.style.background = "var(--gradient)";
      } else if (act === 'restart') {
        srvAction('stop');
        setTimeout(() => srvAction('start'), 2000);
      }
    }

    function logout() {
      if (confirm('تسجيل الخروج؟')) {
        window.location.href = "index.html";
      }
    }

    document.getElementById('newBtn').onclick = () => {
      const name = prompt("اسم السيرفر الجديد:");
      if (name) {
        servers.push({ title: name, subtitle: "New Server", startup_file: "index.js", folder: name.toLowerCase() });
        loadServers();
      }
    };

    document.getElementById('fileInput').onchange = (e) => {
      if (e.target.files.length > 0) {
        alert(`تم رفع ${e.target.files.length} ملف بنجاح (وهمي)`);
        const fileList = document.getElementById('serverFileList');
        Array.from(e.target.files).forEach(file => {
          fileList.innerHTML += `<tr><td style="color:var(--accent)">\( {file.name}</td><td> \){(file.size/1024).toFixed(1)} KB</td><td><button class="f-btn">✏️ Edit</button><button class="f-btn" style="background:var(--error)">🗑️ Delete</button></td></tr>`;
        });
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      createAnimatedBackground();
      loadServers();
      document.getElementById('usernameDisplay').textContent = "ayyy1234";
    });
  </script>
</body>
</html>
