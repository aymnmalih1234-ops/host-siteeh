<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>HAMA HOST PANEL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --bg: #05060a;
      --muted: #99a3ad;
      --accent: #00d4ff;
      --accent-light: #6aefff;
      --gradient: linear-gradient(135deg, #00d4ff 0%, #0088ff 50%, #0066cc 100%);
      --success: #00ff88;
      --error: #ff5555;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e9f2f7; min-height: 100vh; position: relative; }
    
    .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
    
    .animated-line { position: absolute; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: moveLine 20s linear infinite; opacity: 0.05; }
    
    @keyframes moveLine { 0% { transform: translateX(-100px); } 100% { transform: translateX(calc(100vw + 100px)); } }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid rgba(0,212,255,0.1); position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; }
    
    .panel-logo { font-size: 18px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    
    .new-btn { background: var(--gradient); color: #00121a; padding: 8px 16px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 12px; transition: all 0.3s; }
    
    .logout-btn { background: transparent; border: 1px solid var(--error); color: var(--error); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    
    #cardsContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    
    .card { padding: 40px 20px; background: rgba(12,17,29,0.8); border-radius: 12px; border: 1px solid rgba(0,212,255,0.1); text-align: center; cursor: pointer; transition: all 0.3s; }
    
    .srv-icon { width: 32px; height: 22px; background: var(--accent); border-radius: 4px; margin: 0 auto 20px; position: relative; box-shadow: 0 8px 0 0 var(--accent); animation: pulse 2s infinite; }
    
    .srv-icon::after { content: ""; position: absolute; top: 4px; left: 22px; width: 4px; height: 4px; background: #000; border-radius: 50%; box-shadow: 0 8px 0 0 #000; }
    
    .card-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(90deg, #fff, var(--accent-light)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    
    .mgr-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; }
    
    .console-box { background: rgba(0,0,0,0.8); padding: 20px; height: 550px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; border-radius: 10px; border: 1px solid rgba(0,212,255,0.1); color: #adbac7; }
    
    .btn-act { width: 100%; padding: 14px; margin-bottom: 10px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; color: white; transition: all 0.3s; }
    
    .btn-act.running { background: white !important; color: black !important; opacity: 0.5; cursor: not-allowed; }
    
    .stat-card { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(0,212,255,0.1); display: flex; align-items: center; gap: 12px; }
    
    .status-running { color: var(--success); animation: pulse 2s infinite; }
    
    .upload-area { border: 2px dashed var(--accent); border-radius: 10px; padding: 40px; text-align: center; margin: 20px 0; cursor: pointer; background: rgba(0,212,255,0.05); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: rgba(0,212,255,0.1); padding: 12px 10px; color: var(--accent); }
    td { padding: 15px 10px; border-bottom: 1px solid rgba(0,212,255,0.1); }
    
    .f-btn { padding: 5px 10px; border-radius: 5px; border: 0; font-size: 11px; cursor: pointer; margin-right: 5px; background: rgba(43,49,58,0.8); color: white; }
    
    .install-btn { background: var(--success); color: black; font-weight: bold; }
  </style>
</head>
<body>
  <div class="animated-bg" id="animatedBg"></div>
  
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button onclick="goHome()" style="background:none;border:0;color:white;font-size:20px;cursor:pointer">🏠</button>
      <div class="panel-logo">HAMA HOST PANEL</div>
    </div>
    <div style="display:flex;align-items:center;gap:15px">
      <div class="user-info">
        <span>Welcome, ayyy1234</span>
        <button class="logout-btn" onclick="window.location.href='index.html'">تسجيل الخروج</button>
      </div>
      <button id="newBtn" class="new-btn">+ أنشاء سرفر</button>
    </div>
  </header>

  <main class="container" id="homeView">
    <div id="cardsContainer">
      <div class="card" onclick="openServer({title:'Main Bot', folder:'bot'})">
        <div class="srv-icon"></div>
        <div class="card-title">Main Bot</div>
        <div class="card-sub">Python Bot</div>
      </div>
    </div>
  </main>

  <main class="container" id="serverView" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1 style="color:var(--accent)">Main Bot</h1>
    </div>

    <div id="viewFiles">
      <div class="upload-area" id="uploadArea">
        <div style="font-size:48px;margin-bottom:15px;color:var(--accent)">🚀</div>
        <div style="color:var(--muted)">اسحب bot.py هنا أو اضغط للرفع</div>
        <input type="file" id="fileInput" style="position:absolute;inset:0;opacity:0;cursor:pointer">
      </div>
      
      <table>
        <thead><tr><th>Name</th><th>Size</th><th>Actions</th></tr></thead>
        <tbody id="serverFileList">
          <!-- الملفات هتظهر هنا -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let isRunning = false;

    function createAnimatedBackground() {
      const container = document.getElementById('animatedBg');
      for (let i = 0; i < 8; i++) {
        const line = document.createElement('div');
        line.className = 'animated-line';
        line.style.top = `${Math.random() * 100}%`;
        container.appendChild(line);
      }
    }

    function openServer(s) {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('newBtn').style.display = 'none';
      document.getElementById('serverView').style.display = 'block';
      loadFiles();
    }

    function goHome() {
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('newBtn').style.display = 'block';
      document.getElementById('serverView').style.display = 'none';
    }

    // رفع الملفات
    document.getElementById('fileInput').onchange = function(e) {
      const files = e.target.files;
      if (files.length === 0) return;
      
      const fileList = document.getElementById('serverFileList');
      Array.from(files).forEach(file => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="color:var(--accent)">${file.name}</td>
          <td>${(file.size / 1024).toFixed(1)} KB</td>
          <td>
            <button class="f-btn" onclick="alert('فتح ${file.name}')">✏️ Edit</button>
            <button class="f-btn" style="background:var(--error)" onclick="this.closest('tr').remove()">🗑️ Delete</button>
          </td>
        `;
        fileList.appendChild(row);
        
        // لو الملف bot.py → أنشئ requirements.txt تلقائي
        if (file.name.toLowerCase() === 'bot.py') {
          createRequirementsRow();
          alert('✅ تم رفع bot.py\nتم إنشاء requirements.txt تلقائيًا مع مكتبات البوت');
        }
      });
    };

    function createRequirementsRow() {
      const fileList = document.getElementById('serverFileList');
      // تجنب التكرار
      if (document.querySelector('td').innerText.includes('requirements.txt')) return;
      
      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="color:var(--accent)">requirements.txt</td>
        <td>0.5 KB</td>
        <td>
          <button class="f-btn install-btn" onclick="installRequirements()">📦 Install & Run</button>
          <button class="f-btn" onclick="alert('المكتبات:\ntelebot\nrequests\nflask\npyrogram')">✏️ View</button>
        </td>
      `;
      fileList.appendChild(row);
    }

    function installRequirements() {
      alert('📦 جاري تثبيت المكتبات...\ntelebot\nrequests\nflask\npyrogram\n...\n✅ تم التثبيت بنجاح!\n🚀 جاري تشغيل bot.py...\nالبوت شغال الآن!');
    }

    document.addEventListener('DOMContentLoaded', createAnimatedBackground);
  </script>
</body>
</html>
